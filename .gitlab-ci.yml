stages:
  - build
  - test
  - deploy

variables:
  IMAGE_NAME: cloudnotes:v1

build:
  stage: build
  script:
    - docker build -t $IMAGE_NAME .

test:
  stage: test
  image: python:3.11
  script:
    - pip install -r requirements.txt
    - pytest

deploy:
  stage: deploy
  script:
    - echo "Déploiement simulé de CloudNotes"
    - echo "Application déployée avec succès"
  only:
    - main
